name: Update cafe data

# สร้างไฟล์ cafes-th.json (ร้านกาแฟทั้งประเทศไทยจาก OpenStreetMap) ให้เว็บ CoffeeMe ใช้
# รันอัตโนมัติวันที่ 1 ของทุกเดือน หรือกดรันเองได้ที่แท็บ Actions > Update cafe data > Run workflow
on:
  schedule:
    - cron: "17 3 1 * *"     # 03:17 UTC วันที่ 1 ทุกเดือน
  workflow_dispatch:

permissions:
  contents: write   # ให้ workflow commit ไฟล์ cafes-th.json กลับเข้า repo ได้
  pages: write      # ให้สั่ง GitHub Pages build ใหม่หลังอัปเดตข้อมูล

jobs:
  build:
    runs-on: ubuntu-24.04    # ล็อกเวอร์ชันไว้ ไม่ให้เปลี่ยนตาม ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Check files in repo
        run: |
          echo "ไฟล์ใน repo:"; ls -la
          if [ -f scripts/build_cafes.py ]; then
            echo "SCRIPT=scripts/build_cafes.py" >> "$GITHUB_ENV"
          elif [ -f build_cafes.py ]; then
            echo "SCRIPT=build_cafes.py" >> "$GITHUB_ENV"
          else
            echo "::error::ไม่เจอไฟล์ build_cafes.py — ต้องอยู่ที่ scripts/build_cafes.py (หรือไว้ที่หน้าแรกของ repo ก็ได้)"
            exit 1
          fi

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      - name: Download Thailand OSM extract (Geofabrik)
        run: |
          curl -fSL --retry 3 -o thailand.osm.pbf https://download.geofabrik.de/asia/thailand-latest.osm.pbf
          ls -lh thailand.osm.pbf

      - name: Keep only cafes / coffee shops
        run: |
          set -euo pipefail
          osmium tags-filter thailand.osm.pbf nwr/amenity=cafe nwr/shop=coffee -o cafes.osm.pbf --overwrite
          osmium export cafes.osm.pbf -f geojsonseq -a type,id -o cafes.geojsonseq --overwrite
          echo "features: $(wc -l < cafes.geojsonseq)"

      - name: Build cafes-th.json
        run: python3 "$SCRIPT" cafes.geojsonseq cafes-th.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafes-th.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update cafe data from OpenStreetMap"
            git push
          fi

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
